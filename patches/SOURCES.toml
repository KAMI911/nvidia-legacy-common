# Master registry of upstream patch sources for the legacy NVIDIA drivers.
# Per-series patches/<series>/PROVENANCE.toml [[source]] blocks reference these
# by `id`. import-patches.sh clones them (git works even though the AUR *web*
# UI is behind Anubis — `git clone https://aur.archlinux.org/<pkg>.git` is fine).
#
# Priority order when the same fix exists in several places:
#   1. megvadulthangya/* + joanbm/*   — widest kernel range (to Linux 7.x), actively
#                                        maintained; primary source for 340/390/470xx
#   2. AUR nvidia-<series>xx-dkms      — fast-moving, covers newest kernels + gcc
#   3. Debian nvidia-team             — policy-clean, well reviewed
#   4. butterfly PPA / MeowIce / Frogging-Family  — distro-specific / bundled
#
# LICENSE NOTE: megvadulthangya/* and several AUR patch files carry no explicit
# licence. They are derivative build-compat patches (conftest tweaks, API-shim
# #ifdefs) — generally below the threshold of originality, but PROVENANCE.toml
# must still record origin repo + commit + "no explicit licence; trivial build
# fix" and we should ask the author to add an SPDX header. Do NOT import anything
# that looks substantive without a clear licence.

[[source]]
id = "debian"
scope = "all"
git = "https://salsa.debian.org/nvidia-team/nvidia-graphics-drivers-legacy-{SERIES}xx.git"
path = "debian/patches"
note = "{SERIES} in 304|340|390; 470 lives in the main nvidia-graphics-drivers repo"
license = "mostly Expat / public-domain build fixes; check debian/copyright"

[[source]]
id = "butterfly"
scope = "340xx,390xx"
git = "https://github.com/kelebek333/nvidia-legacy"
ppa = "ppa:kelebek333/nvidia-legacy"
note = "Ubuntu-oriented; ships ready debian/ dirs + IgnoreABI handling for Xorg 21+"

[[source]]
id = "aur-340"
scope = "340xx"
git = "https://aur.archlinux.org/nvidia-340xx-dkms.git"
also = "https://aur.archlinux.org/nvidia-340xx-utils.git"
note = "340.108-38+, patches kernel-6.x + gcc-14/15; git clone OK (web = Anubis)"

[[source]]
id = "flydiscohuebr-304"
scope = "304xx"
git = "https://github.com/flydiscohuebr/nvidia-304"
note = """PRIMARY 304xx (active, 2026). Archlinux/nvidia-304.137/nvidia-304xx-utils/
0001..0030 patches: kernel 3.19 .. 6.15 .. 7.0, gcc-14/15. Also ships a patched
xorg-server 1.19 tree (with backported CVE fixes) + lib32 utils. We take the
KERNEL patches only; the Xorg-1.19 route is not portable to Debian/Ubuntu.
No LICENSE file — treat as build-fix patches, record provenance."""

# NOTE: AUR nvidia-304xx-dkms is STALE (pkgver 304.125). Do not use it; prefer
# flydiscohuebr-304 + Debian nvidia-team's legacy-304xx branch.

[[source]]
id = "aur-390"
scope = "390xx"
git = "https://aur.archlinux.org/nvidia-390xx-dkms.git"
also = "https://aur.archlinux.org/nvidia-390xx-utils.git"
note = "390.157-17+, patches: kernel-6.12/6.13/6.14/6.15/6.17, gcc-14, gcc-15"

[[source]]
id = "aur-470"
scope = "470xx"
git = "https://aur.archlinux.org/nvidia-470xx-dkms.git"
also = "https://aur.archlinux.org/nvidia-470xx-utils.git"
note = "470.256.02-8.x+, kernel 6.14/6.15 + gcc14"

[[source]]
id = "aur-580"
scope = "580xx"
git = "https://aur.archlinux.org/nvidia-580xx-dkms.git"
also = "https://aur.archlinux.org/nvidia-580xx-open-dkms.git"
note = "ACTIVE branch (580.95.05 .. 580.178.04+); proprietary + open variants"

[[source]]
id = "joanbm-470"
scope = "470xx"
git = "https://github.com/joanbm/nvidia-470xx-linux-mainline"
note = "Per-kernel patches to head; roughly tracks AUR but ahead. MIT-ish, per-file headers."

# --- megvadulthangya: Manjaro-flavoured, widest kernel coverage (to 7.2/7.3) ---
[[source]]
id = "hangya-390"
scope = "390xx"
git = "https://github.com/megvadulthangya/nvidia-390xx-utils"
branch = "master"
note = """PRIMARY 390xx. Arch PKGBUILD layout. 24 patches: kernel-6.1..6.6, 6.8, 6.10,
6.12..6.15, 6.17, 6.18 (nv_workqueue_flush), 6.19, 7.0, 7.2, plus gcc-14/15,
CFLAGS std=gnu17, kernel-4.16+ memory-encryption, make-modesetting-default.
prepare() in the PKGBUILD gives the exact apply order. No LICENSE file."""

[[source]]
id = "hangya-390-settings"
scope = "390xx"
git = "https://github.com/megvadulthangya/nvidia-390xx-settings"
branch = "master"
note = "nvidia-settings build patches: remove-gtk2, libXNVCtrl .so, VDPAUDeviceFunctions static. For the -driver-bin / settings packaging."

[[source]]
id = "hangya-340"
scope = "340xx"
git = "https://github.com/megvadulthangya/nvidia-340xx-utils"
branch = "master"
note = "340xx userspace packaging (config files, sysusers, outputclass). Pairs with hangya-340-modules for the kernel side."

[[source]]
id = "hangya-340-modules"
scope = "340xx"
git = "https://github.com/megvadulthangya/nvidia-340xx"
branch = "main"
note = """340xx KERNEL side, prebuilt-per-kernel model (mirrors our modules repo!):
normal-kernels/linux{61,66,612,618,71,72}-nvidia-340xx/PKGBUILD + rt-kernels/*.
Each PKGBUILD's prepare() lists the kernel patch set for that ABI — use these to
seed patches/340xx/kernel/ with .kmax gates and to pick feasible ABIs for
nvidia-legacy-modules tools/kernels.yaml."""

[[source]]
id = "hangya-lib32-340"
scope = "340xx"
git = "https://github.com/megvadulthangya/lib32-nvidia-340xx-utils"
branch = "master"
note = "32-bit userspace lib layout for 340xx — reference for our :i386 multiarch driver-libs."

[[source]]
id = "meowice"
scope = "340xx,390xx,470xx"
git = "https://github.com/MeowIce/nvidia-legacy"
note = "branch per driver version; bundled .run + kernel patches 5.8..6.8+; MIT"

[[source]]
id = "frogging-family"
scope = "current,open"
git = "https://github.com/Frogging-Family/nvidia-all"
note = "not legacy, but good reference for the open-module + Xorg glue if an 'open' track is added"

[[source]]
id = "arch-open"
scope = "open"
git = "https://gitlab.archlinux.org/archlinux/packaging/packages/nvidia-open.git"
note = "official Arch nvidia-open-dkms PKGBUILD — reference for the open-kernel-module packaging (580xx-open, future 590+)"
