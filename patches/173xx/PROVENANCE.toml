# Provenance for patches/173xx/ — EXPERIMENTAL forward-port track.
# Reference: patches/304xx/ (same flat legacy layout). See
# docs/forward-port-status/173xx.md for the full API-break roadmap.
series = "173xx"
upstream_version = "173.14.39"

[[source]]
id = "debian"
git = "https://salsa.debian.org/nvidia-team/nvidia-graphics-drivers-legacy-173xx.git"
path = "debian/patches"
license = "Expat / public-domain build fixes"

[[source]]
id = "304xx-derived"
note = "hunks adapted from patches/304xx/kernel/* — same os-interface.c / nv-linux.h structure"

[[patch]]
file = "kernel/0001-fix-kbuild-subdirs-to-m.patch"
from = "nvidia-legacy"
fixes = "Makefile.kbuild's KBUILD_PARAMS used the deprecated SUBDIRS=$(PWD), which modern kbuild silently ignores, so `make module` fell through to attempting a full in-tree kernel modules build (wanting arch/x86/tools/relocs_32.c, arch/x86/entry/syscalls/syscall_32.tbl, tools/build/Build.include -- none of which ship in a linux-headers-only package) instead of an external module build against this driver's own sources. M=$(PWD) is the modern equivalent. This was the actual reason 173 could never be build-tested at all -- confirmed by rebuilding with just this one-line fix: NVIDIA's own build harness then runs to completion and starts compiling nv.c/os-interface.c/etc for real."
license = "trivial build shim"

[[patch]]
file = "kernel/0002-timespec64-kernel-5.0.patch.kmax-5.0"
from = "304xx-derived"
adapted_from = "304xx/kernel/0006-do_gettimeofday-5.0.patch.kmax-5.0"
fixes = "do_gettimeofday()/struct timeval removed in Linux 5.0; guarded timespec64 conversion in os-interface.c + nv.h"
license = "build-fix / no explicit licence (derivative of NVIDIA source + trivial API shim)"
status = "gated into kernel/ -- build-verified clean (nvidia.ko produced) together with 0003 below on both Ubuntu 20.04/kernel 5.4.0-200-generic and Ubuntu 24.04/kernel 6.8.0-139-generic, via the real apply-patches.sh --apply path against a fresh .run extraction."

[[patch]]
file = "kernel/0003-modern-kernel-forward-port.patch"
from = "nvidia-legacy"
fixes = "Full forward-port of 173xx to modern kernels, covering every API break found after 0001+0002 unblocked real compilation: conftest.sh 2013-vintage build_cflags() missing -include .../kconfig.h before autoconf.h (IS_ENABLED() undefined, poisoning conftest.h for every later probe); <acpi/acpi.h>/<acpi/acpi_bus.h>/<acpi/acpi_drivers.h> direct inclusion refused by modern arch/x86 aclinux.h (use <linux/acpi.h>); struct acpi_driver_ops.remove signature (2-arg int -> 1-arg int -> 1-arg void, now a real 3-way conftest probe, not a version guard); struct acpi_device losing its own children/node list_head (walking it now needs an EXPORT_SYMBOL_GPL API this proprietary module can't call, so on those kernels the CRT/TV/LCD/DVI ACPI handles are simply left unpopulated rather than force a GPL symbol into a non-GPL module); register_cpu_notifier()/CPU_DOWN_PREPARE/CPU_DOWN_FAILED hotplug notifier API removed; spin_unlock_wait() removed (falls back to lock/unlock pair, matching upstream's own conversion of every other caller); read_cr4()/write_cr4() moved into <asm/special_insns.h> under new __-prefixed names; struct file.f_dentry removed (-> f_path.dentry); pud_offset() 4/5-level pgtable signature drift in a long-dead PAT fallback path that a broken set_pages_uc() conftest probe was wrongly routing every modern kernel into (probe only checked <asm/cacheflush.h>, but the function moved to <asm/set_memory.h>); init_timer()/timer_list.data removed (-> timer_setup()/from_timer()); mtrr_add()/mtrr_del() no longer EXPORT_SYMBOL'd for out-of-tree modules (link failure, not a compile failure) -- replaced with arch_phys_wc_add()/arch_phys_wc_del(), threading the returned handle through nv_linux_state_t / the existing wb_mem_t free list instead of the old reg=-1 base+size lookup; vma->vm_flags became a read-only accessor in Linux 6.3+ (-> vm_flags_set()); __vmalloc() lost its pgprot_t argument in Linux 5.8 (every caller in this driver already passes cached=TRUE, so plain vmalloc() is exact, not approximate); ioremap_nocache() removed (-> ioremap(), non-cached on every arch now); PDE()/PDE_DATA() -> pde_data(); procfs decoupled from struct file_operations into struct proc_ops in Linux 5.6+; pci_map_sg()/pci_unmap_sg() (<linux/pci-dma-compat.h> removed entirely) -> dma_map_sg()/dma_unmap_sg(); current->state direct assignment (always wrong, even on old kernels) -> set_current_state(); a genuine pre-existing bug where nv-linux.h's ioctl32.h include was guarded by the wrong macro name (HAVE_COMPAT_IOCTL, which is never defined anywhere) instead of the real NV_FILE_OPERATIONS_HAS_COMPAT_IOCTL, silently working by accident as long as linux/ioctl32.h still existed; and finally tasklet_disable() in the adapter-shutdown path blocking on the EXPORT_SYMBOL_GPL tasklet_unlock_wait() -- replaced with tasklet_kill() (plain EXPORT_SYMBOL, and arguably the more correct primitive for a final teardown regardless). Every new conftest.sh probe added for this is a real compile probe (several using a wrong-argument-count trick to get a reliable answer despite this script's own CFLAGS carrying no -Werror), not a LINUX_VERSION_CODE guess, per the timer_delete_sync precedent elsewhere in this repo."
license = "build-fix / no explicit licence (derivative of NVIDIA source + trivial API shims, matching the license basis of 0001/0002 above)"
status = "build-verified clean (nvidia.ko produced, zero warnings/errors) on both Ubuntu 20.04/kernel 5.4.0-200-generic and Ubuntu 24.04/kernel 6.8.0-139-generic, via the real apply-patches.sh --apply path against a fresh .run extraction."

[[patch]]
file = "kernel/0004-debian-headers-gcc14-and-i386.patch"
from = "nvidia-legacy"
fixes = "Closes the two remaining gaps noted in docs/forward-port-status/173xx.md (6.9-6.12 untested, i386 untested) -- found genuine, previously-unknown bugs along the way that affect EVERY currently-shipped 173xx target on Debian 12/13 or any gcc-14+ toolchain, not just the 6.9-6.12 range specifically: (1) Debian splits kernel-headers into a slim per-flavor package (include/{config,generated} and arch/ only) plus a '-common' package holding the actual linux/*.h, uapi/*.h, arch/*/include/asm/*.h etc; the flavor package's own Makefile is just 'include /path/to/...-common/Makefile', which real kbuild follows automatically via $(srctree), but conftest.sh's own manually-reconstructed -I/-include paths (all rooted at $HEADERS = $SOURCES/include) do not -- so linux/kconfig.h (IS_ENABLED(), needed since the 0003 cascade-poisoning fix) and a great many other headers silently don't exist there, breaking select_makefile itself and then most later probes. Fixed by detecting the real header root the same way the flavor Makefile does (parse its one 'include' line) and adding it to every relevant search path in build_cflags()/test_headers(); a no-op on non-split layouts (e.g. Ubuntu). (2) GCC 14 promoted -Wimplicit-function-declaration/-Wimplicit-int/-Wint-conversion from warnings to hard errors by default. The overwhelming majority of this 2013-vintage conftest.sh's presence probes -- both original and the ones added in 0003 -- rely on calling a possibly-undeclared function and checking whether the compile still succeeds (undeclared used to be a harmless warning; a real, wrong-arity/wrong-type call is a hard error regardless of this flag, which is what makes the trick work at all). Under gcc 14's new default, every such probe hard-fails whether the function is present or not, returning false negatives across the board. Fixed by explicitly restoring the pre-14 default in conftest.sh's own BASE_CFLAGS (-Wno-error=implicit-function-declaration and friends) -- the real kbuild-driven compilation of the driver's own .c files is unaffected either way, since kbuild has always passed -Werror=implicit-function-declaration explicitly, never relying on gcc's default. (3) One genuine remaining compile fix surfaced once the above two were fixed: nv-vm.c's struct scatterlist.page_link assignment from virt_to_page() needs an explicit (unsigned long) cast under gcc 14's -Wint-conversion-as-error. (4) i386-specific: read_cr4()/write_cr4() (added in 0003) go through <asm/special_insns.h>'s __read_cr4()/__write_cr4() when present, which on x86_64 are __always_inline (fine, already verified working), but on i386 call the out-of-line native_write_cr4()/native_read_cr4(), which are NOT EXPORT_SYMBOL'd -- an out-of-tree module gets an undefined-symbol link failure at modpost, not a compile error, so this was invisible until an actual i386 build was attempted. Fixed by only taking the special_insns.h path on NVCPU_X86_64; i386 (and any kernel without the header) uses the pre-existing raw-inline-asm fallback, which needs no kernel symbol at all. Verified via the real apply-patches.sh --apply path against fresh .run extractions (amd64 and i386 separately): nvidia.ko builds clean on Debian trixie/kernel 6.12.107 (gcc 14.2.0, the actual kernel_max target) and on i386 Debian bookworm/kernel 6.1.0-53-686-pae, with no regression re-verified on the already-shipped Ubuntu 20.04/5.4 and Ubuntu 24.04/6.8 targets."
license = "trivial build shim / bug fix"
status = "build-verified clean (nvidia.ko produced, zero errors) on Debian trixie/6.12.107 (amd64), Debian bookworm/6.1.0-53-686-pae (i386), Ubuntu 20.04/5.4.0-200-generic, and Ubuntu 24.04/6.8.0-139-generic -- via the real apply-patches.sh --apply path against fresh .run extractions each time. Closes the last two known gaps from docs/forward-port-status/173xx.md's Progress checklist; only real-hardware runtime testing remains."
