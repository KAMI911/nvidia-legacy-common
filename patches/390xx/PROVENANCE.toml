from = "nvidia-legacy"
fixes = "add <linux/version.h> to files using LINUX_VERSION_CODE without it (-Werror=undef on 6.x)"
license = "trivial build shim"

[[patch]]
file = "kernel/0023-fix-in-hardirq-guard.patch"
from = "nvidia-legacy"
fixes = "0019-kernel-6.19 fallout: in_irq() -> in_hardirq() rename applied unconditionally, but distro kernels (e.g. Ubuntu -generic point releases) commonly lack in_hardirq() well past kernels that have it upstream; added a real conftest.sh probe + compat #define instead"
license = "build-fix"

[[patch]]
file = "kernel/0024-disable-objtool-nvidia-o.patch"
from = "nvidia-legacy"
fixes = "dkms build failure on Ubuntu noble generic/lowlatency (objtool: indirect jump found in MITIGATION_RETPOLINE build, on the closed nv-kernel.o blob linked into nvidia.o); same class of fix as 340xx's nvidia.o objtool-enabled override"
license = "build-fix"

[[patch]]
file = "kernel/0025-objtool-per-object.patch"
from = "nvidia-legacy"
fixes = "0024 only disabled objtool on the final linked nvidia.o; objtool also runs on every individual object (e.g. nvidia/nv.o) before that link and hit the identical MITIGATION_RETPOLINE failure there -- confirmed still failing in CI after 0024 alone. Extends the override to every object this Kbuild fragment builds."
license = "build-fix"

[[patch]]
file = "kernel/0026-objtool-real-fix.patch"
from = "nvidia-legacy"
fixes = "0024 and 0025's `override objtool-enabled =` does not actually disable objtool -- confirmed still failing identically in CI (and in a from-scratch local rebuild with the real no-SYSSRC build command) after both landed. Replaces them with OBJECT_FILES_NON_STANDARD := y, the real kernel-documented mechanism (scripts/Makefile.build). Verified locally: builds clean on the exact previously-failing kernel (ubuntu:24.04 + linux-headers-6.8.0-139-generic) with no regression on 5.4.0-200-generic."
license = "build-fix"
