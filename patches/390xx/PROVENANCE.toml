# Provenance for every patch under patches/390xx/.
# One [[patch]] block per file. `import-patches.sh` verifies that every *.patch
# on disk has a block here (and vice versa) — CI fails otherwise.
#
# Filename convention (gates, see apply-patches.sh / render-debian.py):
#   NNNN-short-description[.kmax-<maj>.<min>][.abimin-<abi>].patch
#     .kmax-6.12  : only include when the target kernel_max >= 6.12
#     .abimin-25  : only include when the target xserver_abi <= 25 ... (min the driver needs)

series = "390xx"
upstream_version = "390.157"

# ---------------------------------------------------------------------------
# Sources we import from (kept in sync by import-patches.sh):
[[source]]
id = "debian"
name = "Debian nvidia-team"
git = "https://salsa.debian.org/nvidia-team/nvidia-graphics-drivers-legacy-390xx.git"
path = "debian/patches"
license = "see debian/copyright in that repo (mostly Expat / public-domain build fixes)"

[[source]]
id = "butterfly"
name = "Ubuntu butterfly PPA (kelebek333)"
git = "https://github.com/kelebek333/nvidia-legacy"
ppa = "ppa:kelebek333/nvidia-legacy"
license = "GPL-2 build fixes / Expat"

[[source]]
id = "arch"
name = "Arch Linux nvidia-390xx (AUR)"
git = "https://aur.archlinux.org/nvidia-390xx.git"
license = "per-file; mostly public-domain kernel build fixes"

[[source]]
id = "meowice"
name = "MeowIce/nvidia-legacy"
git = "https://github.com/MeowIce/nvidia-legacy"
branch = "390.157"
license = "MIT (repo LICENSE)"

