# Provenance for every patch under patches/96xx/.
# One [[patch]] block per file. `import-patches.sh` verifies that every *.patch
# on disk has a block here (and vice versa) — CI fails otherwise.
#
# Filename convention (gates, see apply-patches.sh / render-debian.py):
#   NNNN-short-description[.kmax-<maj>.<min>][.abimin-<abi>].patch
#     .kmax-6.12  : only include when the target kernel_max >= 6.12
#     .abimin-25  : only include when the target xserver_abi <= 25 ... (min the driver needs)

