[[patch]]
file = "kernel/0001-fix-kbuild-subdirs-to-m.patch"
from = "nvidia-legacy"
fixes = "Makefile.kbuild's KBUILD_PARAMS used the deprecated SUBDIRS=$(PWD), which modern kbuild silently ignores, causing it to attempt a full in-tree kernel modules build (wanting arch/x86/tools/relocs_32.c, arch/x86/entry/syscalls/syscall_32.tbl etc. that a linux-headers-only package doesn't ship) instead of an external module build. M=$(PWD) is the modern equivalent. Confirmed this exact bug and fix on the sibling 173xx series (nvidia.ko actually built past this point there); 96xx itself hit an earlier, separate blocker (conftest.sh select_makefile: \"Unable to determine the target kernel version\"), now fixed by 0002 below."
license = "trivial build shim"

[[patch]]
file = "kernel/0002-fix-select-makefile-modern-kernels.patch"
from = "nvidia-legacy"
fixes = "Two independent bugs in this 2012-vintage conftest.sh/Makefile.kbuild that both wrongly diagnosed the target kernel as unbuildable on any modern kernel, before reaching real compilation: (1) conftest.sh's select_makefile case only checked for linux/version.h at $HEADERS/$FILE or $OUTPUT/include/$FILE, but that header now lives at $OUTPUT/include/generated/uapi/linux/version.h (a UAPI-header-split-era relocation); once found, the actual Linux-2.6-vs-3.x compile probe then also failed because build_cflags() never added -I.../include/uapi or -I.../include/generated/uapi to CFLAGS at all (a related, second gap in the same area), and separately never added -include .../linux/kconfig.h before autoconf.h (the same IS_ENABLED()-undefined cascade-poisoning bug found and fixed in 173xx's conftest.sh). (2) Makefile.kbuild's own PATCHLEVEL-based Linux-2.4 detection (ifeq ($(PATCHLEVEL), 4)) is fundamentally broken for any modern x.4 kernel (5.4, 6.4, 7.4, ...): PATCHLEVEL here is inherited from the target kernel's own VERSION.PATCHLEVEL.SUBLEVEL numbering via kbuild's own exported make variables, and 5.4's PATCHLEVEL=4 collides by coincidence with the ancient Linux-2.4.x PATCHLEVEL value this check was actually trying to detect -- wrongly routing kernel 5.4 down the Linux-2.4-only build paths (Rules.make inclusion, .o instead of .ko module extension), which don't exist on a modern kernel tree. Replaced with a derived NV_IS_KERNEL_2_4 variable that also requires VERSION == 2. Verified via the real apply-patches.sh --apply path against a fresh .run extraction: the build now gets all the way past select_makefile into real Kbuild compilation of nv.c and friends, surfacing genuine API-break compile errors (same general class as 173xx's forward-port, e.g. struct file.f_dentry) -- a further, larger forward-port effort, not attempted here; this patch's scope is strictly the select_makefile/PATCHLEVEL misdetection."
license = "trivial build shim"

[[patch]]
file = "kernel/0003-modern-kernel-forward-port.patch"
from = "nvidia-legacy"
fixes = "Full forward-port past the select_makefile blocker fixed by 0002, addressing the same general class of API breaks as 173xx's own 0003 (many of the individual fixes are the exact same shim, ported from there once verified applicable): ACPI headers consolidated onto <linux/acpi.h>; conftest.sh gained probes for <asm/kmap_types.h>, <asm/special_insns.h> and <asm/set_memory.h> presence (all live under arch/x86/include, invisible to the existing header-prefix probe), arch_phys_wc_add/_del (replacing unexported mtrr_add/mtrr_del -- fixes a link-time-only 'undefined symbol: mtrr_add/mtrr_del' failure invisible at compile time; both os-agp.c and os-interface.c's write-combining paths and their handle-tracking now go through NV_MTRR_ADD/NV_MTRR_DEL), smp_call_function/on_each_cpu int-vs-void return, spin_unlock_wait removal, struct file.f_dentry removal, register_cpu_notifier/CPU-hotplug-notifier-API removal (guards nv_kern_cpu_callback and both register/unregister_hotcpu_notifier call sites), pci_map_sg removal (probe only; no driver code path was actually gated on it), ioremap_nocache removal, __vmalloc() losing its pgprot_t argument (Linux 5.8), vm_flags_set() replacing direct vma->vm_flags writes (Linux 6.3+, 5 call sites), i2c_del_adapter() becoming void-returning, and the full create_proc_entry()-era procfs API removal (bridged via a read_proc_t-shaped shim -- nv_proc_shim_t/nv_proc_shim_show/nv_create_proc_read_entry -- so every original nv_kern_read_*() function body is preserved unchanged; nvos_proc_create/nvos_proc_add_text_file/nvos_proc_remove all gained a parallel modern-vs-original #if split). Also fixed, beyond what any conftest probe alone could catch: init_timer()/timer_setup() (Linux 4.15+, exact pattern from 304xx's own 0004-timer-4.15.patch); do_gettimeofday()/struct timeval removal (Linux 5.0+, NV_TIMESPEC64/timespec64 conversion, exact pattern from 173xx's own 0002-timespec64 patch, applied to os_get_current_time/os_delay_us/os_delay in os-interface.c); num_physpages global removed (get_num_physpages()); a CR4 register-move asm bug (explicit 32-bit 'movl' suffix on a control-register move is rejected by newer assemblers in 64-bit mode -- control-register moves are always native-width regardless of suffix; fixed with a plain unsuffixed 'mov' and unsigned-long-typed operands, correct on both i386 and x86_64); __flush_tlb() (a kernel-internal helper no longer available to modules) replaced with an open-coded CR3 reload (NV_FLUSH_TLB(), exact pattern from 173xx's nv-linux.h); current->state direct assignment replaced with set_current_state() (task_struct.state was renamed/hidden on very recent kernels); CORE_OBJS (nv-kernel.o, the closed-source RM core blob) routed through Kbuild's if_changed so newer kbuild's modpost can find a .cmd file for it (otherwise a hard 'could not find .nv-kernel.o.cmd' failure -- exact pattern from 173xx's own 0003); and tasklet_disable() replaced with an open-coded busy-wait against the public TASKLET_STATE_RUN bit (NV_TASKLET_DISABLE()), because tasklet_unlock_wait() -- which tasklet_disable() calls internally -- became an EXPORT_SYMBOL_GPL out-of-line function on later kernels (it was a plain non-GPL busy-wait static inline on older ones; only the linkage changed, not the actual wait semantics), which this proprietary-licensed (MODULE_LICENSE(\"NVIDIA\")) module cannot call directly -- a modpost 'GPL-incompatible module uses GPL-only symbol' failure, not a compile error. Verified building cleanly (real apply-patches.sh --apply path, fresh .run extraction, full non-truncated build logs grepped for error:/#error/ERROR:) on ubuntu2004 (Linux 5.4) and ubuntu2404 (Linux 6.8); Debian trixie (6.12) and i386 not yet re-verified after this patch (tracked in docs/forward-port-status/96xx.md)."
license = "GPL-2 / trivial build shim; procfs shim and timespec64/CR4/tasklet fixes are original work following the exact patterns already shipped and verified in 173xx/304xx"
