[[patch]]
file = "kernel/0001-fix-modeset-objtool.patch"
from = "nvidia-legacy"
fixes = "nvidia-modeset.ko's linked-in closed nv-modeset-kernel.o_binary blob isn't objtool-clean (RETHUNK mitigation: \"'naked' return found in MITIGATION_RETHUNK build\") -- fixed proactively with the same OBJECT_FILES_NON_STANDARD mechanism used for 390xx/470xx/304xx's own nv-kernel.o. Non-fatal either way (build succeeds regardless); this is a warning-suppression fix, not a build-breakage fix."
license = "trivial build shim"
status = "CORRECTED after a later, more rigorous re-verification: this patch genuinely works, but only on kernels where CONFIG_X86_KERNEL_IBT is NOT set (Ubuntu 20.04/22.04/24.04 and most non-Debian kernels) -- confirmed clean (0 objtool warnings) there. The original \"0 on trixie\" claim was wrong: on Debian trixie specifically (CONFIG_X86_KERNEL_IBT=y), a clean two-tree A/B rebuild (fresh .run extraction, both with and without this patch) shows IDENTICAL warning counts (2506 on nvidia-modeset.o, unaffected by this patch either way) -- the original verification likely reused a stale/cached build. Root cause, traced into the kernel's own scripts/Makefile.lib: `delay-objtool := $(or $(CONFIG_LTO_CLANG),$(CONFIG_X86_KERNEL_IBT))`, and scripts/Makefile.build's `$(multi-obj-m): private objtool-enabled := $(delay-objtool)` -- when IBT is on, the whole linked module's objtool check is unconditionally deferred to link time (needed for correct ENDBR/IBT validation across the whole module), completely bypassing the per-object OBJECT_FILES_NON_STANDARD exclusion this patch relies on. This is not overridable from a Kbuild fragment: Makefile.build's own generic rule for this variable is evaluated after (and so wins over) anything a Kbuild fragment sets for the same target -- the same reason the 390xx-era 'override objtool-enabled' attempt silently no-op'd. There is no known driver-side fix for the IBT-enabled case; it would need NVIDIA to ship an IBT/RETHUNK-compliant blob. Separately (not touched by this patch at all): the MAIN nvidia.ko also carries ~44969 identical warnings from its own nv-kernel.o_binary on trixie, for the same underlying IBT reason -- same story, no driver-side fix available."
