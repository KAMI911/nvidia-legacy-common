[[patch]]
file = "kernel/0001-fix-kbuild-subdirs-to-m.patch"
from = "nvidia-legacy"
fixes = "Makefile.kbuild's KBUILD_PARAMS used the deprecated SUBDIRS=$(PWD), which modern kbuild silently ignores, causing it to attempt a full in-tree kernel modules build instead of an external module build (same bug as 96xx/173xx). M=$(PWD) is the modern equivalent. Confirmed this exact bug and fix on the sibling 173xx series; now also confirmed on 71xx itself (see 0002 below), which build-verifies this patch too."
license = "trivial build shim"

[[patch]]
file = "kernel/0002-fix-select-makefile-modern-kernels.patch"
from = "nvidia-legacy"
fixes = "Same class of 2011-vintage conftest.sh/Makefile.kbuild bugs as the sibling 96xx series (see patches/96xx/PROVENANCE.toml for the full writeup of the select_makefile linux/version.h relocation and the PATCHLEVEL/VERSION Linux-2.4-detection collision), plus one 71xx-specific gap the 96xx fix didn't need: build_cflags() was missing -I$OUTPUT/arch/x86/include/generated entirely (96xx already had it), so once select_makefile itself was fixed, the very next conftest probe (a plain #include <linux/utsname.h>, pulled in via sched.h -> pid.h -> wait.h -> spinlock.h) failed with \"fatal error: asm/mmiowb.h: No such file or directory\" -- x86 has no arch-specific asm/mmiowb.h, only the generic include/asm-generic/mmiowb.h that kbuild symlinks into arch/x86/include/generated/asm/ for exactly this reason. Verified via the real apply-patches.sh --apply path against a fresh .run extraction: the build now reaches real Kbuild compilation of nv.c/nv-linux.h, surfacing genuine API-break compile errors (acpi_walk_namespace conftest failure, unconditional asm/system.h include) of the same general class as 96xx/173xx's forward-port work -- a further, larger effort, not attempted here; this patch's scope is strictly the select_makefile/PATCHLEVEL/mmiowb.h misdetection chain."
license = "trivial build shim"

[[patch]]
file = "kernel/0003-modern-kernel-forward-port.patch"
from = "nvidia-legacy"
fixes = "Full forward-port past the select_makefile blocker fixed by 0002. 71xx (71.86.15) is a full major version older than 96xx (96.43.23) and lacks nv-i2c.c entirely (no I2C bus support in this driver at all -- the i2c_del_adapter_returns_int conftest probe from 96xx's own 0003 was dropped, not ported), but otherwise reached the exact same class of API-break errors as 96xx's forward-port once past select_makefile, and most of 96xx's 0003 fix set (ACPI headers -> <linux/acpi.h>, the full conftest.sh probe block for arch/x86-local headers/arch_phys_wc_add/on_each_cpu&smp_call_function-returns-int/ioremap_nocache/proc_ops&proc_create_data&pde_data_lowercase/spin_unlock_wait/register_cpu_notifier/vm_flags_set/vmalloc_has_pgprot_arg/pci_map_sg, the full read_proc_t procfs shim, init_timer/timer_setup, do_gettimeofday removal was N/A -- 71xx never used it, num_physpages removal was N/A -- 71xx never used it either, the CR4 asm fix, NV_FLUSH_TLB, CORE_OBJS/if_changed [renamed RESMAN_CORE_OBJS here], and NV_TASKLET_DISABLE) applied via a fuzzy patch-and-manually-fix-the-rejects port from 96xx's already-verified 0003, not written fresh. Three further, 71xx-specific issues surfaced beyond that port: (1) an unconditional '#include <asm/system.h>' inside the pm_message_t conftest probe itself (not the nv-linux.h include this driver already gates) made that ONE probe hard-fail its own compile regardless of the real pm_message_t availability, so nv-linux.h's compat 'typedef u32 pm_message_t' fallback always fired and collided with the kernel's real struct-based pm_message_t ('conflicting types for pm_message_t') -- fixed by dropping the stray include from the probe. (2) 71xx's CONFTEST_PREAMBLE never included conftest.h/autoconf.h (unlike 96xx/173xx's), so no conftest.sh probe could ever see an earlier probe's result via '#if defined(NV_XXX_PRESENT)' within conftest.sh itself -- harmless for probes with no such cross-probe dependency, but silently made the newly-ported set_pages_uc fix (which checks NV_ASM_SET_MEMORY_H_PRESENT) never actually take effect, still routing modern kernels into the long-dead manual pud/pmd/pte page-table-walk fallback in _get_phys_address(). Fixing the preamble to match 96xx/173xx then exposed a second, structural gap: 71xx's compile_tests case computes its FILES-based defines (crucially NV_GENERATED_AUTOCONF_H_PRESENT) *after* running the individual probes, not before like 96xx/173xx's test_headers()-first structure -- so with the preamble fix alone, EVERY probe's own '#include <generated/autoconf.h>' fell through to the nonexistent '<linux/autoconf.h>', hard-failing every single probe uniformly. Fixed by reordering compile_tests to compute FILES-defines first. That reorder in turn exposed a third bug: select_makefile (and the separate rivafb_sanity_check/nvidiafb_sanity_check checks) also use CONFTEST_PREAMBLE, and run *before* $(obj)/conftest.h is ever built by Kbuild's own compile_tests rule (that rule has no listed prerequisite, so once a stale conftest.h exists from an earlier phase, Make treats the target as already up to date and never re-runs the real probe sequence at all) -- each of those three call sites now writes a minimal conftest.h (just the two defines CONFTEST_PREAMBLE actually needs) before using it, and deletes it again afterward, matching 96xx/173xx's own select_makefile pattern exactly (96xx/173xx's select_makefile already did the delete-afterward half; only 71xx was missing it, since it never had a test_headers()-based conftest.h in the first place to model that half on). (3) the pud_offset() 4-to-5-level-pagetable signature drift (pgd_t* vs p4d_t*) that 173xx's own broken-conftest-probe writeup already documented turned out, for 71xx specifically, to be reachable even with NV_SET_PAGES_UC_PRESENT correctly detected: unlike 173xx's nv_get_phys_address() (which wraps its *entire* body, both kernel- and user-address cases, in one '#if defined(NV_SET_PAGES_UC_PRESENT)' early-return), 71xx's original _get_phys_address() only early-returned for the kernel-address case, leaving the user-address case to always fall through to the manual pgd/pmd/pte walk regardless of NV_SET_PAGES_UC_PRESENT -- restructured to match 173xx's simpler all-or-nothing gating (the manual walk is genuinely dead weight on any kernel with set_pages_uc(), for both address kinds). Also fixed along the way: mm->mmap_sem renamed to the mmap_lock API in Linux 5.8 (NV_MMAP_READ_LOCK/NV_MMAP_READ_UNLOCK, gated on LINUX_VERSION_CODE), and pte_offset_map()'s RCU-based reimplementation on 6.5+ kernels pulling in the GPL-only __rcu_read_unlock symbol at link time (a modpost failure, not a compile error) -- both only reachable through the same manual-walk fallback the pud_offset fix above disables outright, so no separate fix was needed once that path was gated off. Verified building cleanly (real apply-patches.sh --apply path, fresh .run extraction, full non-truncated build logs grepped for error:/#error/ERROR:) on ubuntu2004 (Linux 5.4) and ubuntu2404 (Linux 6.8). Debian trixie (6.12, the kernel_max target) and i386 not yet attempted (no Debian-split-headers/gcc14 fix ported here at all, unlike 96xx's 0003+0004 or 173xx's 0003+0004) -- tracked in docs/forward-port-status/71xx.md."
license = "GPL-2 / trivial build shim; procfs shim and CR4/tasklet/mmap_lock/p4d_offset fixes are original work following the exact patterns already shipped and verified in 96xx/173xx/304xx"
