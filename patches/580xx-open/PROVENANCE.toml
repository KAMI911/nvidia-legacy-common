# ---------------------------------------------------------------------------
# NOTE (no patch -- investigated, no driver-side fix exists): nvidia.ko's
# closed nv-kernel.o_binary blob (kernel-open's "open" nvidia.ko still links
# a closed core RM/GSP blob, same as the non-open 580xx series) produces
# thousands of "'naked' return found in MITIGATION_RETHUNK build" objtool
# warnings on any kernel with CONFIG_X86_KERNEL_IBT=y (e.g. Debian trixie).
# This is the exact same issue documented in patches/580xx/PROVENANCE.toml's
# kernel/0001-fix-modeset-objtool.patch entry, which explains in full why
# OBJECT_FILES_NON_STANDARD cannot suppress it once IBT forces kbuild to
# defer the whole-module objtool check to link time -- see that entry for
# the full root-cause trace. No driver-side fix is known; this is a kernel
# build-system + vendor-blob interaction, not something patchable here.
#
# CORRECTION (previous note in this spot was wrong, not a regression --
# re-investigated on a from-scratch build against debian:trixie/6.12):
# kernel-open's nvidia-modeset.ko is NOT actually blob-free. kernel-open/
# nvidia-modeset/ links nv-modeset-kernel.o_binary, a precompiled closed
# ELF relocatable (dated well before any local build, not something kbuild
# produces here) -- the exact same kind of vendor blob as nv-kernel.o_binary
# for the main nvidia.ko, just a second, smaller one specific to the modeset
# module. Cross-checking every "naked return" warning's function name (base
# name, with gcc's .part.N/.isra.N/.constprop.N interprocedural-optimization
# suffixes stripped from both sides before comparing) against this blob's
# own symbol table: 2627 of 2629 distinct warnings on a debian:trixie build
# match a symbol that exists in nv-modeset-kernel.o_binary, including
# recognizable driver-internal names (DSC_GeneratePPS, ConfigureCsc0C5,
# FrameLockSetVideoMode, etc.) that look like real open source at a glance
# but are compiled into the blob, not from any .c file under kernel-open/.
# The earlier "~500 auto-generated trampoline-style functions [...] is
# NVIDIA's own [buildable, fixable] code" claim was an artifact of not
# checking the blob's symbol table before concluding a function must be
# locally compiled -- it is the same root cause as the main nv-kernel.o
# blob throughout, with no separate open-code objtool issue to fix.
