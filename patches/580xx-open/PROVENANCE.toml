# Provenance for every patch under patches/580xx-open/.
# One [[patch]] block per file. `import-patches.sh` verifies that every *.patch
# on disk has a block here (and vice versa) — CI fails otherwise.
#
# Filename convention (gates, see apply-patches.sh / render-debian.py):
#   NNNN-short-description[.kmax-<maj>.<min>][.abimin-<abi>].patch
#     .kmax-6.12  : only include when the target kernel_max >= 6.12
#     .abimin-25  : only include when the target xserver_abi <= 25 ... (min the driver needs)

series = "580xx-open"
upstream_version = "580.95.05"

# ---------------------------------------------------------------------------
# Sources — reference ../SOURCES.toml by id; override/pin here as needed.
[[source]]
id = "aur-580"
git = "https://aur.archlinux.org/nvidia-580xx-open-dkms.git"
also = "https://aur.archlinux.org/nvidia-580xx-open-utils.git"
license = "per-file; mostly public-domain / GPL-2 kernel build fixes"
patches_of_interest = [
  "kernel-6.12.patch", "kernel-6.13.patch", "kernel-6.14.patch",
  "kernel-6.15.patch", "kernel-6.17.patch", "gcc-14.patch", "gcc-15.patch",
]

[[source]]
id = "debian"
git = "https://salsa.debian.org/nvidia-team/nvidia-graphics-drivers-legacy-580xx-open.git"
path = "debian/patches"
license = "see debian/copyright (mostly Expat / public-domain build fixes)"

[[source]]
id = "butterfly"
git = "https://github.com/kelebek333/nvidia-legacy"
ppa = "ppa:kelebek333/nvidia-legacy"
license = "GPL-2 build fixes / Expat"

[[source]]
id = "meowice"
git = "https://github.com/MeowIce/nvidia-legacy"
branch = "580.95.05"
license = "MIT (repo LICENSE)"

