# Old X servers we build as co-installable, private-path packages for the legacy
# NVIDIA blobs whose nvidia_drv.so / libglx.so cannot load on the distro X server.
#
# Each entry -> a binary package  xorg-server-legacy-nvidia-<abi>  installed under
#   /opt/nvidia-legacy/xserver-<abi>/{bin,lib,share}
# launched via the shared wrapper  /usr/bin/nvidia-legacy-xserver  and a
# display-manager session file. Never replaces the distro Xorg.
#
# Build reality: old xorg-server needs patches to compile with gcc-14/15 and
# current libX* — we carry those in xserver-legacy/debian/patches/<version>/.

schema_version: 1

servers:
  "1.19":
    version: "1.19.7"
    video_abi: 23
    tarball: "https://www.x.org/releases/individual/xserver/xorg-server-1.19.7.tar.bz2"
    sha256: "UNVERIFIED"          # verify-run-style gate; fill with verify-xserver.sh
    serves: [304xx]
    status: best-effort
    notes: "Last 1.19. Needs gcc-14 + libtirpc + openssl-3 build patches."

  "1.15":
    version: "1.15.1"
    video_abi: 19
    tarball: "https://www.x.org/releases/individual/xserver/xorg-server-1.15.1.tar.bz2"
    sha256: "UNVERIFIED"
    serves: [173xx]
