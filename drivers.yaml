# drivers.yaml — single source of truth for every legacy NVIDIA driver series.
#
# Consumed by:
#   scripts/verify-run.sh      (download + checksum the .run installers)
#   scripts/render-debian.py   (render debian/ from debian-template/<series>/)
#   scripts/apply-patches.sh   (select + apply the right patch series)
#   CI matrix generation       (.github/workflows/*)
#
# Checksums: run `scripts/verify-run.sh --update <series>` to populate the
# `sha256` fields from the real upstream artifacts. Never hand-edit a hash.
# A value of "UNVERIFIED" makes verify-run.sh refuse to proceed in CI.
#
# xorg_abi_max: highest xserver video driver ABI the (patched) X driver loads
#   against. Targets whose xserver ABI exceeds this get `Option "IgnoreABI"`
#   auto-injected AND are marked best-effort (non-blocking CI).
# kernel_max: highest mainline kernel the (patched) kernel module builds against.

schema_version: 1

defaults:
  # Upstream mirrors. {arch_dir} in {x86_64|x86}, {ver} = version.
  url_template: "https://download.nvidia.com/XFree86/Linux-{arch_dir}/{ver}/{run}"
  url_template_legacy: "https://us.download.nvidia.com/XFree86/Linux-{arch_dir}/{ver}/{run}"
  # NVIDIA does not publish detached signatures for XFree86 .run files; integrity
  # is anchored on pinned sha256 + the reproducible-build .buildinfo chain.
  gpg: null

series:

  "580xx":
    version: "580.95.05"         # ACTIVE legacy branch — bump as NVIDIA respins
    status: supported
    gpu_families: "Maxwell, Pascal, Volta (GeForce GTX 700/900/1000, TITAN V)"
    eol_note: >
      Last driver branch for Maxwell/Pascal/Volta. NVIDIA still ships kernel-compat
      + security fixes here (the 590 branch drops these GPUs). Track upstream respins.
    active_upstream: true         # unlike the frozen series, NVIDIA still releases
    architectures: [amd64]        # no 32-bit anything since the 470 branch
    lib_architectures: [amd64]
    xorg_abi_max: 25
    kernel_max: "6.16"
    variants: [proprietary, open] # 580xx also has an open-kernel-module flavour
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-580.95.05.run"
        url_kind: default
        sha256: "UNVERIFIED"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: true

  "470xx":
    version: "470.256.02"
    status: supported            # supported | best-effort | experimental
    gpu_families: "Kepler (GeForce 600/700 series)"
    eol_note: "Upstream EOL 2024-Q3. Community-patched for newer kernels (see joanbm)."
    architectures: [amd64]        # no i386 kernel module upstream
    lib_architectures: [amd64, i386]
    xorg_abi_max: 25
    kernel_max: "7.3"            # AUR nvidia-470xx-utils patches to 7.3; joanbm/nvidia-470xx-linux-mainline tracks head
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-470.256.02.run"
        url_kind: default
        sha256: "d6451862deb695bb0447f3b7cd6268f73e81168c10e2c10597ff3fa01349b1de"
        sha512: "a837946dd24d7945c1962a695f1f31965f3ceb6927f52cd08fd51b8db138b7a888bbeab69243f5c8468a7bd7ccd47f5dbdb48a1ca81264866c1ebb7d88628f88"
        cross_verified: "AUR nvidia-470xx-utils sha512sums"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: true

  "390xx":
    version: "390.157"
    status: supported
    gpu_families: "Fermi, Kepler (GeForce 400/500/600/700 series)"
    eol_note: "Upstream EOL 2022-12. Community-patched for newer kernels/Xorg."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 25
    kernel_max: "7.2"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-390.157.run"
        url_kind: default
        sha256: "5bebbca6e8fed5d6b9d81070fb9e351f18edc534952553cbdc71e8fd0b9b328a"
        sha512: "4780503a4cff0180b1b1f37d20a6ba3438dd78b51fa7f69b98d35521835e5d61099129746929d51d63afa2d47b672b3e145e1e1897584dc3799e7f822c5b3a0a"
        cross_verified: "AUR nvidia-390xx-utils b2sums"
      i386:
        run: "NVIDIA-Linux-x86-390.157.run"
        url_kind: default
        sha256: "55d65e0a4539a9cb796200c5f1082fe263fb0951deaaf96a9cffeb8a80f70799"
        sha512: "dae9ac2c12f9ad90f7441e00e01a984147c577892421911d7f67f6a31e616ac1cb7d434bc9c7f58fbd9b8ae909521b5bece607a63c79588c0bb9d99c6bad5fb0"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: false

  "340xx":
    version: "340.108"
    status: supported
    gpu_families: "GeForce 8/9/200/300 series (G8x, G9x, GT2xx)"
    eol_note: "Upstream EOL 2019-12. Known unfixable security issues — ship with a loud warning."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 24
    x_driver_max_abi: 25          # loads on Xorg 21 with IgnoreABI (butterfly PPA)
    kernel_max: "7.2"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-340.108.run"
        url_kind: default
        sha256: "c671d4f1b7c09bc1af079b98b447adb06d704b04f802f7045a611fa50133b71b"
        sha512: "7941b5496b2c17b06320d676a51ec2866c08a3d3dce9d7cf20464bc35ccb4616c398eb247d1f1e5039386aa73bb610a36937252ce4ad47959437938db8cf3c29"
      i386:
        run: "NVIDIA-Linux-x86-340.108.run"
        url_kind: default
        sha256: "2032aad612d9f3af1aecf979cfdfe423d79aa76929ef8bf8d3a403076f507cca"
        sha512: "cf122c4cf724737cc647bc3d115e853bfe17027d5070c5ed68caf78e0dab718e7345bf824d0e8b33489bf299957dab8ff249cb0f837c3d17b2bb60887afe2818"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false

  "304xx":
    version: "304.137"
    status: best-effort
    gpu_families: "GeForce 6/7 series (NV4x, G7x)"
    eol_note: >
      Upstream EOL 2017-09. Kernel module IS maintainable to Linux ~7.0
      (flydiscohuebr/nvidia-304, 30 patches). The X driver only loads against
      xserver video ABI <= 23 (xorg-server <= 1.19) — GLX symbol mismatches make
      IgnoreABI unreliable on 1.20+. See docs/legacy-feasibility.md.
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 23
    kernel_max: "7.0"
    # On targets whose xserver ABI > 23: build the kernel module + libs (CUDA /
    # compute / VDPAU still work), but do NOT ship the broken X driver.
    x_driver_max_abi: 23
    modern_feasible: true          # kernel side only
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-304.137.run"
        url_kind: default
        sha256: "UNVERIFIED"
      i386:
        run: "NVIDIA-Linux-x86-304.137.run"
        url_kind: default
        sha256: "UNVERIFIED"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false

  # ---------------------------------------------------------------------------
  # 173xx / 96xx / 71xx: metadata kept for completeness, but NOT wired into any
  # build target. These fail to build from kernel ~4.14 (spin_unlock_wait removal)
  # and no maintained patch set carries them to 5.x/6.x. Their X drivers need
  # xserver <= 1.15 / 1.12 / 1.4. Realistic home = Debian <= 10 era. Out of scope
  # for the current targets (all >= Debian 11 / Ubuntu 20.04). See
  # docs/legacy-feasibility.md. modern_feasible: false => regen/CI ignore them.
  # ---------------------------------------------------------------------------
  "173xx":
    version: "173.14.39"
    status: unsupported-modern
    modern_feasible: false
    gpu_families: "GeForce FX 5xxx series (NV3x)"
    eol_note: "Upstream EOL 2013. Builds only up to kernel ~4.13, xserver <= 1.15."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 15
    kernel_max: "4.13"
    runs:
      amd64: { run: "NVIDIA-Linux-x86_64-173.14.39-pkg2.run", url_kind: legacy, sha256: "UNVERIFIED" }
      i386:  { run: "NVIDIA-Linux-x86-173.14.39-pkg1.run",    url_kind: legacy, sha256: "UNVERIFIED" }
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false

  "96xx":
    version: "96.43.23"
    status: unsupported-modern
    modern_feasible: false
    gpu_families: "GeForce 2/3/4 Ti series (NV1x, NV2x)"
    eol_note: "Upstream EOL 2012. Builds only up to kernel ~3.13, xserver <= 1.12."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 10
    kernel_max: "3.13"
    runs:
      amd64: { run: "NVIDIA-Linux-x86_64-96.43.23-pkg2.run", url_kind: legacy, sha256: "UNVERIFIED" }
      i386:  { run: "NVIDIA-Linux-x86-96.43.23-pkg1.run",    url_kind: legacy, sha256: "UNVERIFIED" }
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false

  "71xx":
    version: "71.86.15"
    status: unsupported-modern
    modern_feasible: false
    gpu_families: "TNT/TNT2, GeForce 256, GeForce 2/4 MX (NV0x, NV1x)"
    eol_note: "Upstream EOL 2011. Builds only up to kernel ~2.6.38, xserver <= 1.4."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 4
    kernel_max: "2.6.38"
    runs:
      amd64: { run: "NVIDIA-Linux-x86_64-71.86.15-pkg2.run", url_kind: legacy, sha256: "UNVERIFIED" }
      i386:  { run: "NVIDIA-Linux-x86-71.86.15-pkg1.run",    url_kind: legacy, sha256: "UNVERIFIED" }
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false

# Distro targets. `xserver_abi` is the video driver ABI shipped by that release;
# compared against series.xorg_abi_max to decide IgnoreABI + best-effort status.
targets:
  debian11:   { obs_repo: Debian_11,     codename: bullseye, xserver_abi: 24, i386_kernel: true,  default_kernel: "5.10" }
  debian12:   { obs_repo: Debian_12,     codename: bookworm, xserver_abi: 25, i386_kernel: true,  default_kernel: "6.1" }
  debian13:   { obs_repo: Debian_13,     codename: trixie,   xserver_abi: 25, i386_kernel: true,  default_kernel: "6.12" }
  ubuntu2004: { obs_repo: xUbuntu_20.04, codename: focal,    xserver_abi: 24, i386_kernel: false, default_kernel: "5.4" }
  ubuntu2204: { obs_repo: xUbuntu_22.04, codename: jammy,    xserver_abi: 25, i386_kernel: false, default_kernel: "5.15" }
  ubuntu2404: { obs_repo: xUbuntu_24.04, codename: noble,    xserver_abi: 25, i386_kernel: false, default_kernel: "6.8" }
