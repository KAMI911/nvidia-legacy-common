# drivers.yaml — single source of truth for every legacy NVIDIA driver series.
#
# Consumed by:
#   scripts/verify-run.sh      (download + checksum the .run installers)
#   scripts/render-debian.py   (render debian/ from debian-template/<series>/)
#   scripts/apply-patches.sh   (select + apply the right patch series)
#   CI matrix generation       (.github/workflows/*)
#
# Checksums: run `scripts/verify-run.sh --update <series>` to populate the
# `sha256` fields from the real upstream artifacts. Never hand-edit a hash.
# A value of "UNVERIFIED" makes verify-run.sh refuse to proceed in CI.
#
# xorg_abi_max: highest xserver video driver ABI the (patched) X driver loads
#   against. Targets whose xserver ABI exceeds this get `Option "IgnoreABI"`
#   auto-injected AND are marked best-effort (non-blocking CI).
# kernel_max: highest mainline kernel the (patched) kernel module builds against.

schema_version: 1

defaults:
  # Upstream mirrors. {arch_dir} in {x86_64|x86}, {ver} = version.
  url_template: "https://download.nvidia.com/XFree86/Linux-{arch_dir}/{ver}/{run}"
  url_template_legacy: "https://us.download.nvidia.com/XFree86/Linux-{arch_dir}/{ver}/{run}"
  # NVIDIA does not publish detached signatures for XFree86 .run files; integrity
  # is anchored on pinned sha256 + the reproducible-build .buildinfo chain.
  gpg: null

series:

  "580xx":
    version: "580.178.04"         # ACTIVE legacy branch — bump as NVIDIA respins
    status: supported
    gpu_families: "Maxwell, Pascal, Volta (GeForce GTX 700/900/1000, TITAN V)"
    eol_note: >
      Last driver branch for Maxwell/Pascal/Volta. NVIDIA still ships kernel-compat
      + security fixes here (the 590 branch drops these GPUs). Track upstream respins.
    active_upstream: true         # unlike the frozen series, NVIDIA still releases
    architectures: [amd64]        # no 32-bit anything since the 470 branch
    lib_architectures: [amd64]
    xorg_abi_max: 25
    kernel_max: "6.16"
    module_source: kernel          # proprietary modules
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-580.178.04.run"
        url_kind: default
        sha256: "5975a86ee45bffcb626f51ae33d1169b108186a2ea47ad651e72f13fa4b6d6f9"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: true
    provides_vdpau: true

  "580xx-open":
    version: "580.178.04"
    status: supported
    gpu_families: "Turing+ recommended; also Maxwell/Pascal/Volta (same GPUs as 580xx)"
    eol_note: >
      Open-source flavour of the 580 branch: builds the kernel-open/ modules
      (MIT/GPL-2 dual-licensed) instead of the proprietary blob modules. Same
      userspace libraries. NVIDIA's preferred path going forward.
    active_upstream: true
    architectures: [amd64]
    lib_architectures: [amd64]
    xorg_abi_max: 25
    kernel_max: "6.16"
    module_source: kernel-open    # <- the free modules in the same .run
    module_license: "MIT/GPL-2"
    same_run_as: "580xx"           # verify-run reuses the 580xx blob + hash
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-580.178.04.run"
        url_kind: default
        sha256: "5975a86ee45bffcb626f51ae33d1169b108186a2ea47ad651e72f13fa4b6d6f9"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: true
    provides_vdpau: true

  "470xx":
    version: "470.256.02"
    status: supported            # supported | best-effort | experimental
    gpu_families: "Kepler (GeForce 600/700 series)"
    eol_note: "Upstream EOL 2024-Q3. Community-patched for newer kernels (see joanbm)."
    architectures: [amd64]        # no i386 kernel module upstream
    lib_architectures: [amd64, i386]
    xorg_abi_max: 25
    kernel_max: "7.3"            # AUR nvidia-470xx-utils patches to 7.3; joanbm/nvidia-470xx-linux-mainline tracks head
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-470.256.02.run"
        url_kind: default
        sha256: "d6451862deb695bb0447f3b7cd6268f73e81168c10e2c10597ff3fa01349b1de"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: true
    provides_vdpau: true

  "390xx":
    version: "390.157"
    status: supported
    gpu_families: "Fermi, Kepler (GeForce 400/500/600/700 series)"
    eol_note: "Upstream EOL 2022-12. Community-patched for newer kernels/Xorg."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 25
    kernel_max: "7.2"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-390.157.run"
        url_kind: default
        sha256: "5bebbca6e8fed5d6b9d81070fb9e351f18edc534952553cbdc71e8fd0b9b328a"
        cross_verified: "AUR nvidia-390xx-utils b2sums"
      i386:
        run: "NVIDIA-Linux-x86-390.157.run"
        url_kind: default
        sha256: "55d65e0a4539a9cb796200c5f1082fe263fb0951deaaf96a9cffeb8a80f70799"
    provides_egl: true
    provides_vulkan: true
    provides_nvenc: false
    provides_vdpau: true

  "340xx":
    version: "340.108"
    status: supported
    gpu_families: "GeForce 8/9/200/300 series (G8x, G9x, GT2xx)"
    eol_note: "Upstream EOL 2019-12. Known unfixable security issues — ship with a loud warning."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 24
    x_driver_max_abi: 25          # loads on Xorg 21 with IgnoreABI (butterfly PPA)
    kernel_max: "7.2"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-340.108.run"
        url_kind: default
        sha256: "c671d4f1b7c09bc1af079b98b447adb06d704b04f802f7045a611fa50133b71b"
      i386:
        run: "NVIDIA-Linux-x86-340.108.run"
        url_kind: default
        sha256: "2032aad612d9f3af1aecf979cfdfe423d79aa76929ef8bf8d3a403076f507cca"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false
    provides_vdpau: true

  "304xx":
    version: "304.137"
    status: best-effort
    gpu_families: "GeForce 6/7 series (NV4x, G7x)"
    eol_note: >
      Upstream EOL 2017-09. Kernel module forward-ported to Linux ~7.2 (import
      flydiscohuebr/nvidia-304 + adapt 390xx patches). X driver needs the private
      xorg-server-legacy-nvidia-23 (video ABI 23). See docs/legacy-feasibility.md.
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 23
    kernel_max: "7.2"              # target of the forward-port track
    x_via: legacy-xserver          # ship xorg-server-legacy-nvidia-23, not xserver-xorg-video-*
    x_driver_max_abi: 23
    modern_feasible: true
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-304.137.run"
        url_kind: default
        sha256: "eb1f56db3a2bea13e3ccde7b5ae14abe8cd6c6dbe69af4c71c68a623cc96e3e2"
      i386:
        run: "NVIDIA-Linux-x86-304.137.run"
        url_kind: default
        sha256: "ca98379fc2090bdfe8b74113d6ac7bcc7eadbd86a489c3c4ec4cd5ba9f6064f8"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false
    provides_vdpau: true

  # ---------------------------------------------------------------------------
  # 173xx / 96xx / 71xx: EXPERIMENTAL forward-port track (user-requested "try all
  # three"). kernel_max = the forward-port TARGET, not a proven value. Progress
  # per kernel: docs/forward-port-status/<series>.md (feasibility-recheck.sh).
  # X via the private xorg-server-legacy-nvidia-<abi>. Never blocking in CI.
  # Known hard blockers: 173 = spin_unlock_wait (4.14); 96/71 = 2.6-era pci/agp.
  # ---------------------------------------------------------------------------
  "173xx":
    version: "173.14.39"
    status: experimental
    modern_feasible: true
    forward_port: in-progress
    gpu_families: "GeForce FX 5xxx series (NV3x)"
    eol_note: "Upstream EOL 2013. Forward-port target kernel 6.12 LTS / xserver ABI 19."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 19
    x_via: legacy-xserver
    x_driver_max_abi: 19
    kernel_max: "6.12"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-173.14.39-pkg2.run"
        url_kind: legacy
        sha256: "15a953666d5681ba54c97498b578ffd286a1dc96d605f3b02110f3f99813100e"
      i386:
        run: "NVIDIA-Linux-x86-173.14.39-pkg1.run"
        url_kind: legacy
        sha256: "934d2e0d45405dbe4523dca013a3a0a2b91984721146017bb1d2418e3f4f16e1"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false
    provides_vdpau: false

  "96xx":
    version: "96.43.23"
    status: experimental
    modern_feasible: true
    forward_port: in-progress
    gpu_families: "GeForce 2/3/4 Ti series (NV1x, NV2x)"
    eol_note: "Upstream EOL 2012. Forward-port target kernel 6.12 LTS / xserver ABI 12. High risk."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 12
    x_via: legacy-xserver
    x_driver_max_abi: 12
    kernel_max: "6.12"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-96.43.23-pkg2.run"
        url_kind: legacy
        sha256: "ce8d8253e7dab7da63fbdac449ebf190cd0c10cbfffea0f8d0165515f851bc64"
      i386:
        run: "NVIDIA-Linux-x86-96.43.23-pkg1.run"
        url_kind: legacy
        sha256: "d24087d9f52918652f459e4f194a328459cb7c6c80f352301893b09f18e65af2"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false
    provides_vdpau: false

  "71xx":
    version: "71.86.15"
    status: experimental
    modern_feasible: true
    forward_port: in-progress
    gpu_families: "TNT/TNT2, GeForce 256, GeForce 2/4 MX (NV0x, NV1x)"
    eol_note: "Upstream EOL 2011. Forward-port target kernel 6.12 LTS / xserver ABI 2. Very high risk."
    architectures: [amd64, i386]
    lib_architectures: [amd64, i386]
    xorg_abi_max: 2
    x_via: legacy-xserver
    x_driver_max_abi: 2
    kernel_max: "6.12"
    runs:
      amd64:
        run: "NVIDIA-Linux-x86_64-71.86.15-pkg2.run"
        url_kind: legacy
        sha256: "01104a5d804e21d3f0898f23d2cb3dffc8b782452176269e071ca625d3e1c944"
      i386:
        run: "NVIDIA-Linux-x86-71.86.15-pkg1.run"
        url_kind: legacy
        sha256: "1eb8e3d6e51b6dc86ad716267a37da659b82d349e51dc317fb1368a685b2e15f"
    provides_egl: false
    provides_vulkan: false
    provides_nvenc: false
    provides_vdpau: false

# Distro targets. `xserver_abi` is the video driver ABI shipped by that release;
# compared against series.xorg_abi_max to decide IgnoreABI + best-effort status.
# `dh_compat` overrides the debhelper-compat level (default 13) — focal ships
# only debhelper 12.
targets:
  debian11:   { obs_repo: Debian_11,     codename: bullseye, xserver_abi: 24, i386_kernel: true,  default_kernel: "5.10" }
  debian12:   { obs_repo: Debian_12,     codename: bookworm, xserver_abi: 25, i386_kernel: true,  default_kernel: "6.1" }
  debian13:   { obs_repo: Debian_13,     codename: trixie,   xserver_abi: 25, i386_kernel: true,  default_kernel: "6.12" }
  ubuntu2004: { obs_repo: xUbuntu_20.04, codename: focal,    xserver_abi: 24, i386_kernel: false, default_kernel: "5.4",  dh_compat: 12 }
  ubuntu2204: { obs_repo: xUbuntu_22.04, codename: jammy,    xserver_abi: 25, i386_kernel: false, default_kernel: "5.15" }
  ubuntu2404: { obs_repo: xUbuntu_24.04, codename: noble,    xserver_abi: 25, i386_kernel: false, default_kernel: "6.8" }
  ubuntu2604: { obs_repo: xUbuntu_26.04, codename: resolute,  xserver_abi: 25, i386_kernel: false, default_kernel: "6.14" }
